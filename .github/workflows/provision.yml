name: Provision Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Resource group name"
        required: true
        default: "blazorinvaders-rg"
      location:
        description: "Azure region"
        required: true
        default: "westeurope"
      app_name:
        description: "Static Web App name (must be globally unique)"
        required: true
        default: "blazorinvaders"
      storage_name:
        description: "Storage account name (3-24 lowercase alphanumeric chars, globally unique)"
        required: true
        default: "blazorinvadersstore"
      function_app_name:
        description: "Function App name (must be globally unique)"
        required: true
        default: "blazorinvaders-api"
      custom_domain:
        description: "Custom domain, e.g. yourdomain.com (leave blank to skip)"
        required: false
        default: ""
      max_instances:
        description: "Maximum Function App instances (caps scale-out and cost)"
        required: true
        default: "1"
      daily_quota_gb_seconds:
        description: "Daily Function App usage quota in GB-seconds (the app stops for the day when it is hit)"
        required: true
        default: "10000"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      LOCATION: ${{ inputs.location }}
      APP_NAME: ${{ inputs.app_name }}
      STORAGE_NAME: ${{ inputs.storage_name }}
      FUNCTION_APP_NAME: ${{ inputs.function_app_name }}
      CUSTOM_DOMAIN: ${{ inputs.custom_domain }}
      MAX_INSTANCES: ${{ inputs.max_instances }}
      DAILY_QUOTA_GB_SECONDS: ${{ inputs.daily_quota_gb_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate inputs
        run: bash .github/scripts/validate-dispatch-inputs.sh RESOURCE_GROUP LOCATION APP_NAME STORAGE_NAME FUNCTION_APP_NAME 'CUSTOM_DOMAIN?' MAX_INSTANCES DAILY_QUOTA_GB_SECONDS

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        run: |
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION"

      - name: Create storage account
        run: |
          az storage account create \
            --name "$STORAGE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --sku Standard_LRS \
            --min-tls-version TLS1_2

      - name: Get storage connection string
        id: storage
        run: |
          CONN_STR=$(az storage account show-connection-string \
            --name "$STORAGE_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query connectionString -o tsv)
          echo "::add-mask::$CONN_STR"
          echo "connection_string=$CONN_STR" >> $GITHUB_OUTPUT

      - name: Create Static Web App
        run: |
          az staticwebapp create \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --sku Free

      - name: Create Function App (consumption plan)
        run: |
          az functionapp create \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --storage-account "$STORAGE_NAME" \
            --consumption-plan-location "$LOCATION" \
            --runtime dotnet-isolated \
            --runtime-version 10 \
            --functions-version 4 \
            --os-type Windows

      - name: Configure Function App settings
        env:
          STORAGE_CONN_STR: ${{ steps.storage.outputs.connection_string }}
        run: |
          az functionapp config appsettings set \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --settings \
              "AzureWebJobsStorage=$STORAGE_CONN_STR" \
              "FUNCTIONS_WORKER_RUNTIME=dotnet-isolated"

      - name: Set scale limit and daily quota
        run: |
          az resource update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME/config/web" \
            --resource-type "Microsoft.Web/sites/config" \
            --set properties.functionAppScaleLimit="$MAX_INSTANCES"
          az functionapp update \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set dailyMemoryTimeQuota="$DAILY_QUOTA_GB_SECONDS"

      - name: Get SWA deployment token and hostname
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "deployment_token=$TOKEN" >> $GITHUB_OUTPUT

          HOSTNAME=$(az staticwebapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query defaultHostname -o tsv)
          echo "hostname=$HOSTNAME" >> $GITHUB_OUTPUT

      - name: Get Function App hostname
        id: func
        run: |
          FUNC_HOSTNAME=$(az functionapp show \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query defaultHostName -o tsv)
          echo "hostname=$FUNC_HOSTNAME" >> $GITHUB_OUTPUT

      - name: Resolve API URL
        id: urls
        env:
          FUNC_HOSTNAME: ${{ steps.func.outputs.hostname }}
        run: |
          API_URL="https://$FUNC_HOSTNAME/api"
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

      - name: Configure CORS on Function App
        env:
          SWA_HOSTNAME: ${{ steps.swa.outputs.hostname }}
        run: |
          az functionapp cors add \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --allowed-origins "https://$SWA_HOSTNAME"

          if [ -n "$CUSTOM_DOMAIN" ]; then
            az functionapp cors add \
              --name "$FUNCTION_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --allowed-origins "https://$CUSTOM_DOMAIN"
            az functionapp cors add \
              --name "$FUNCTION_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --allowed-origins "https://www.$CUSTOM_DOMAIN"
          fi

      - name: Save secrets to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SWA_TOKEN: ${{ steps.swa.outputs.deployment_token }}
          API_URL: ${{ steps.urls.outputs.api_url }}
        run: |
          printf '%s' "$SWA_TOKEN" | gh secret set SWA_DEPLOYMENT_TOKEN \
            --repo "$GITHUB_REPOSITORY"

          printf '%s' "$API_URL" | gh secret set FUNCTIONS_API_URL \
            --repo "$GITHUB_REPOSITORY"

          printf '%s' "$FUNCTION_APP_NAME" | gh secret set AZURE_FUNCTION_APP_NAME \
            --repo "$GITHUB_REPOSITORY"


      - name: Summary
        env:
          SWA_HOSTNAME: ${{ steps.swa.outputs.hostname }}
          API_URL: ${{ steps.urls.outputs.api_url }}
        run: |
          HOSTNAME="$SWA_HOSTNAME"

          echo "## Provisioning complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App URL** | https://$HOSTNAME |" >> $GITHUB_STEP_SUMMARY
          echo "| **API URL** | $API_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Max instances** | $MAX_INSTANCES |" >> $GITHUB_STEP_SUMMARY
          echo "| **Daily quota (GB-s)** | $DAILY_QUOTA_GB_SECONDS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitHub secrets have been set automatically." >> $GITHUB_STEP_SUMMARY
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Custom domain — action required" >> $GITHUB_STEP_SUMMARY
            echo "Add these DNS records first, then run **Set Custom Domain**:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Type | Host | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| CNAME | \`$CUSTOM_DOMAIN\` | \`$HOSTNAME\` |" >> $GITHUB_STEP_SUMMARY
            echo "| CNAME | \`www.$CUSTOM_DOMAIN\` | \`$HOSTNAME\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Push to \`master\` (or trigger **Deploy** manually) to publish the app." >> $GITHUB_STEP_SUMMARY
