name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Build
        run: |
          dotnet build src/BlazorInvaders.csproj --nologo
          dotnet build src/api/BlazorInvaders.Api.csproj --nologo

      - name: Test
        run: dotnet test tests/BlazorInvaders.Tests --nologo

  build_and_deploy:
    needs: build_and_test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Inject API URL into appsettings.json
        env:
          FUNCTIONS_API_URL: ${{ secrets.FUNCTIONS_API_URL }}
        run: |
          sed -i "s|#{FUNCTIONS_API_URL}#|${FUNCTIONS_API_URL}|g" \
            src/wwwroot/appsettings.json

      - name: Publish Blazor WASM
        run: |
          dotnet publish src/BlazorInvaders.csproj \
            -c Release \
            -o release \
            --nologo

      - name: Publish Azure Functions
        run: |
          dotnet publish src/api/BlazorInvaders.Api.csproj \
            -c Release \
            -o api-release \
            --nologo

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: release/wwwroot
          skip_app_build: true
          api_location: ""

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: api-release
