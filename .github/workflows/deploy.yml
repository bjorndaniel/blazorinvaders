name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x

      - name: Check formatting
        run: dotnet format src/BlazorInvaders.sln --verify-no-changes

      - name: Build
        run: |
          dotnet build src/BlazorInvaders.csproj --nologo
          dotnet build src/api/BlazorInvaders.Api.csproj --nologo

      - name: Test
        run: dotnet test tests/BlazorInvaders.Tests --nologo

  build_and_deploy:
    needs: build_and_test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x

      - name: Inject API URL into appsettings.json
        env:
          FUNCTIONS_API_URL: ${{ secrets.FUNCTIONS_API_URL }}
        run: |
          sed -i "s|#{FUNCTIONS_API_URL}#|${FUNCTIONS_API_URL}|g" \
            src/wwwroot/appsettings.json

      - name: Publish Blazor WASM
        run: |
          dotnet publish src/BlazorInvaders.csproj \
            -c Release \
            -o release \
            --nologo

      - name: Publish Azure Functions
        run: |
          dotnet publish src/api/BlazorInvaders.Api.csproj \
            -c Release \
            -o api-release \
            --nologo

      # Tag v1 on purpose, not branch v1: the branch points at another commit (4d27395), and pinning it would change the code that runs.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1 # zizmor: ignore[ref-version-mismatch]
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: release/wwwroot
          skip_app_build: true
          api_location: ""

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Functions
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: api-release
