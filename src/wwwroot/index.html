<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BlazorInvaders</title>
    <base href="/" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link href="css/bootstrap/bootstrap.min.css"
        rel="stylesheet" />
    <link href="css/app.css"
        rel="stylesheet" />
    <link href="css/loader.css"
        rel="stylesheet" />
    <link href="BlazorInvaders.styles.css" rel="stylesheet" />
    <link rel="preload" href="fonts/orbitron-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>

<body>
    <div id="app">
        <div class="container">
            <div class="row css-load-parent">
                <div class="col text-center my-auto">
                    <div class="cssload-loader-inner">
                        <div class="cssload-cssload-loader-line-wrap-wrap">
                            <div class="cssload-loader-line-wrap"></div>
                        </div>
                        <div class="cssload-cssload-loader-line-wrap-wrap">
                            <div class="cssload-loader-line-wrap"></div>
                        </div>
                        <div class="cssload-cssload-loader-line-wrap-wrap">
                            <div class="cssload-loader-line-wrap"></div>
                        </div>
                        <div class="cssload-cssload-loader-line-wrap-wrap">
                            <div class="cssload-loader-line-wrap"></div>
                        </div>
                        <div class="cssload-cssload-loader-line-wrap-wrap">
                            <div class="cssload-loader-line-wrap"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href=""
            class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker?.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
